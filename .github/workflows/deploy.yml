name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main, claude/deploy-game-neIrE, claude/traitors-party-rsvp-site-hJVyW, claude/fix-birthday-website-J286H]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: game
        run: npm ci

      - name: Build
        working-directory: game
        run: npm run build

      - name: Verify build output
        run: |
          echo "=== dist contents ==="
          ls -la game/dist/
          echo "=== Checking index.html is invite page ==="
          head -5 game/dist/index.html
          echo "=== Checking game.html is React app ==="
          head -5 game/dist/game.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
